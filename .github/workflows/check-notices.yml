name: 공지 확인

on:
  schedule:
    # 10분마다 실행. 깃허브 부하에 따라 실제로는 더 늦게 돌 수 있다.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Actions 탭에서 수동 실행용

permissions:
  contents: write  # seen.json 을 저장소에 다시 커밋하기 위해 필요

concurrency:
  # 실행이 겹치면 같은 공지를 두 번 알리거나 push 가 충돌한다
  group: notice-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공지 확인 및 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_notices.py

      - name: 확인 기록 저장
        run: |
          if [ -z "$(git status --porcelain seen.json)" ]; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: 확인한 공지 기록 갱신"
          git pull --rebase --autostash
          git push
